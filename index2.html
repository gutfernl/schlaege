<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Schlagkarte Gut Fernlüttkevitz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{ --ink:#1b2d4f; --panel:#ffffff; --line:#e3ded2; --muted:#6b7280; --sidebar:320px; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}
  header{background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;z-index:1200;flex:none}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  header .count{font-size:13px;opacity:.75;font-weight:400}
  .body{flex:1;display:flex;min-height:0}
  aside{width:var(--sidebar);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .searchwrap{padding:10px;border-bottom:1px solid var(--line);flex:none}
  .searchwrap input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;color:var(--ink)}
  .tablewrap{flex:1;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th{position:sticky;top:0;background:#f3f1ea;text-align:left;padding:7px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border-bottom:1px solid var(--line);z-index:2}
  td{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  tr.grp td{background:#eef1f7;font-weight:700;color:var(--ink);cursor:default;position:sticky;top:29px;z-index:1;padding:7px 14px}
  tr.grp .dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.25);margin-right:7px;vertical-align:-1px}
  tr.item:hover td{background:#f4f7ff}
  tr.item.sel td{background:#fff6d6;font-weight:600}
  .noresult{padding:16px 14px;color:var(--muted);font-size:15px}
  #map{flex:1;min-height:0}
  .leaflet-container{background:#3a3a3a}
  .mapbtn{background:#fff;border:none;height:40px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink)}
  .mapbtn.icon{width:40px;justify-content:center;padding:0;font-size:18px}
  .mapbtn+.mapbtn{margin-top:6px}
  .popup h3{margin:0 0 4px;font-size:16px}
  .popup .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
  .popup .nav{display:inline-block;background:#1e6fe0;color:#fff;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:16px;font-weight:600}
  .lbl{background:rgba(27,45,79,.82);color:#fff;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:600;white-space:nowrap;border:none;box-shadow:none}
  .lbl.sel{background:#c8102e;font-size:13px;padding:2px 8px}
  .lbl:before{display:none !important}
  @media (max-width:760px){
    #app{height:auto;min-height:100dvh}
    .body{flex-direction:column;min-height:0}
    #map{height:56vh;flex:none}
    aside{width:auto;border-right:none;border-top:1px solid var(--line)}
    .tablewrap{overflow:visible}
    th{top:0} tr.grp td{top:0}
  }
</style>
</head>

        <div class="noresult" id="noresult" style="display:none">Kein Schlag gefunden.</div>
      </div>
    </aside>
  </div>
</div>

const BLOCK_COLORS = {"1": "#e6194b", "2": "#3cb44b", "3": "#ffe119", "4": "#4363d8", "5": "#f58231", "6": "#911eb4", "7": "#46f0f0", "8": "#f032e6", "9": "#bcf60c", "10": "#fabebe"};
function blockColor(b){ return BLOCK_COLORS[b] || "#cccccc"; }
let sel = null;

/* ---- Karte + Basemaps ---- */
const map = L.map('map',{zoomControl:true}).setView([54.60,13.43],11);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Luftbild © Esri'});
const str = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
sat.addTo(map);
L.control.layers({'Satellit':sat,'Straße':str}, null, {position:'topright', collapsed:true}).addTo(map);

/* Buttons */
const ctrl = L.control({position:'topleft'});
ctrl.onAdd = function(){
  const wrap = L.DomUtil.create('div');
  const b1 = L.DomUtil.create('button','mapbtn',wrap); b1.innerHTML='⤢ Übersicht'; b1.title='Alle Schläge anzeigen';
  const b2 = L.DomUtil.create('button','mapbtn icon',wrap); b2.innerHTML='📍'; b2.title='Auf meinen Standort zentrieren';
  L.DomEvent.on(b1,'click',e=>{L.DomEvent.stop(e);deselect();map.fitBounds(allBounds.pad(0.08));});
  L.DomEvent.on(b2,'click',e=>{L.DomEvent.stop(e);centerOnMe();});
  return wrap;
};
ctrl.addTo(map);

/* ---- Live-Standort (automatisch) ---- */
let meMarker=null, meCircle=null, lastPos=null, watchId=null;
function showMe(lat,lng,acc){
  const ll=[lat,lng];
  if(!meMarker){
    meCircle=L.circle(ll,{radius:acc,color:'#1e6fe0',weight:1,fillColor:'#1e6fe0',fillOpacity:.12}).addTo(map);
    meMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1e6fe0',fillOpacity:1}).addTo(map);
    meMarker.bindTooltip('Mein Standort',{direction:'top'});
  } else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(acc); }
}
function startTracking(centerFirst){
  if(!('geolocation' in navigator)) return;
  if(watchId!==null){ if(centerFirst) centerOnMe(); return; }
  watchId = navigator.geolocation.watchPosition(
    p=>{ lastPos=p.coords; showMe(p.coords.latitude,p.coords.longitude,p.coords.accuracy||20);
         if(centerFirst){ map.setView([p.coords.latitude,p.coords.longitude],15); centerFirst=false; } },
    _=>{ /* Auto-Start: Fehler still ignorieren, erst beim Knopfdruck melden */ },
    {enableHighAccuracy:true, maximumAge:5000, timeout:20000}
  );
}
function centerOnMe(){
  if(lastPos){ map.setView([lastPos.latitude,lastPos.longitude],15); return; }
  startTracking(true);
  setTimeout(()=>{ if(!lastPos) alert('Standort noch nicht verfügbar. Bitte Standortfreigabe erlauben – die Seite muss über https (gutfernl.github.io) laufen.'); }, 1800);
}
/* beim Laden automatisch anzeigen, ohne die Übersicht zu verlassen */
startTracking(false);

/* ---- Schläge zeichnen ---- */
const items = {};
const allPts = [];
SCHLAEGE.forEach(s=>{
  const latlngs = s.r.map(ring => ring.map(([lon,lat])=>[lat,lon]));
  s.r.forEach(ring=>ring.forEach(([lon,lat])=>allPts.push([lat,lon])));
  const poly = L.polygon(latlngs,{color:'#c8102e',weight:2.5,opacity:1,fillColor:blockColor(s.b),fillOpacity:.18}).addTo(map);
  poly.bindPopup(
    '<div class="popup"><h3>'+s.n+'</h3><div class="sub">Block '+s.b+'</div>'+
    '<a class="nav" href="https://www.google.com/maps/dir/?api=1&destination='+s.c[0]+','+s.c[1]+'" target="_blank" rel="noopener">▶ Navigieren</a></div>'
  );
  const fb = poly.getBounds();
  const label = L.tooltip({permanent:true,direction:'center',className:'lbl',opacity:1}).setContent(s.n).setLatLng(fb.getCenter());
  poly.on('click',()=>select(s.n));
  const area = (fb.getEast()-fb.getWest())*(fb.getNorth()-fb.getSouth());
  items[s.n] = {poly,label,s,row:null,fb,area};
});
const allBounds = L.latLngBounds(allPts);
map.fitBounds(allBounds.pad(0.08));

/* ---- Beschriftungen: Name auf dem SICHTBAREN Teil des Schlags, mit Überlappungs-Ausdünnung ---- */
function refreshLabels(){
  const vb = map.getBounds();
  const placed = [];
  const order = Object.keys(items).sort((a,b)=>{
    if(a===sel) return -1; if(b===sel) return 1;
    return items[b].area - items[a].area;
  });
  order.forEach(name=>{
    const it = items[name];
    const allowed = (sel===null) || (sel===name);
    let show=false, pos=null;
    if(allowed && vb.intersects(it.fb)){
      // Mitte des sichtbaren Feldausschnitts -> Label liegt immer im Bild
      const s = Math.max(vb.getSouth(), it.fb.getSouth());
      const n = Math.min(vb.getNorth(), it.fb.getNorth());
      const w = Math.max(vb.getWest(),  it.fb.getWest());
      const e = Math.min(vb.getEast(),  it.fb.getEast());
      pos = L.latLng((s+n)/2, (w+e)/2);
      const p = map.latLngToContainerPoint(pos);
      const pw = it.s.n.length*7.2 + 14, ph = 20;
      const r = {x:p.x-pw/2, y:p.y-ph/2, w:pw, h:ph};
      const hit = placed.some(o => !(r.x+r.w < o.x || r.x > o.x+o.w || r.y+r.h < o.y || r.y > o.y+o.h));
      if(name===sel || !hit){ show=true; placed.push(r); }
    }
    if(show){ it.label.setLatLng(pos); if(!map.hasLayer(it.label)) it.label.addTo(map);
              it.label.getElement()?.classList.toggle('sel', name===sel); }
    else if(map.hasLayer(it.label)){ map.removeLayer(it.label); }
  });
}
map.on('zoomend moveend', refreshLabels);
refreshLabels();

/* ---- Auswahl ---- */
function select(name){
  if(sel && items[sel]){ items[sel].poly.setStyle({color:'#c8102e',weight:2.5,fillColor:blockColor(items[sel].s.b),fillOpacity:.18}); items[sel].row?.classList.remove('sel'); }
  sel = name;
  const it = items[name]; if(!it) return;
  it.poly.setStyle({color:'#8a6d00',weight:4,fillColor:'#ffcc00',fillOpacity:.5});
  it.poly.bringToFront();
  map.fitBounds(it.poly.getBounds().pad(0.35));
  it.poly.openPopup();
  refreshLabels();
  if(it.row){ it.row.classList.add('sel'); it.row.scrollIntoView({block:'nearest'}); }
  if(window.innerWidth<=760) map.getContainer().scrollIntoView({behavior:'smooth',block:'start'});
}
function deselect(){
  if(sel && items[sel]){ items[sel].poly.setStyle({color:'#c8102e',weight:2.5,fillColor:blockColor(items[sel].s.b),fillOpacity:.18}); items[sel].row?.classList.remove('sel'); }
  sel=null; map.closePopup(); refreshLabels();
}

/* ---- Tabelle: nach Block gruppiert ---- */
const tbody = document.getElementById('tbody');
const noresult = document.getElementById('noresult');
document.getElementById('count').textContent = SCHLAEGE.length+' Schläge';
function buildRows(filter){
  const f=(filter||'').toLowerCase().trim(); tbody.innerHTML=''; let shown=0, cur=null;
  SCHLAEGE.forEach(s=>{
    if(f && !(s.n.toLowerCase().includes(f) || ('block '+s.b).includes(f) || s.b===f)) return;
    if(s.b!==cur){ cur=s.b; const g=document.createElement('tr'); g.className='grp';
      g.innerHTML='<td><span class="dot" style="background:'+blockColor(s.b)+'"></span>Block '+s.b+'</td>'; tbody.appendChild(g); }
    shown++;
    const tr=document.createElement('tr'); tr.className='item'; tr.innerHTML='<td>'+s.n+'</td>';
    tr.addEventListener('click',()=>select(s.n)); tbody.appendChild(tr);
    items[s.n].row=tr; if(sel===s.n) tr.classList.add('sel');
  });
  noresult.style.display = shown? 'none':'block';
}
buildRows('');
document.getElementById('q').addEventListener('input',e=>buildRows(e.target.value));

/* Layout/Größe */
function fixSize(){ map.invalidateSize(); refreshLabels(); }
window.addEventListener('resize', fixSize);
window.addEventListener('orientationchange', ()=>setTimeout(fixSize,300));
setTimeout(fixSize,200);
</script>
